<!DOCTYPE html>
<html lang="id">
    <head>
    <meta charset="UTF-8">
    <title>Pesan Rahasia</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

    <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Montserrat', sans-serif;
    }

    body{
        width:100vw;
        height:100dvh; /* FIX mobile viewport */
        background:#000;
        overflow:hidden;
    }

    /* ================= AMPLOP ================= */
    .envelope{
        position: fixed;
        bottom: 50%;
        right: 50%;

        width: 300px;
        height: 200px;

        background: #111;
        border: 1px solid #666;
        cursor: pointer;
        z-index: 1000;

        transform: translate(50%, 50%) rotate(90deg);
        transition: transform 1.1s cubic-bezier(.55, .05, .85, .45);
        transition: bottom 0.9s cubic-bezier(.4,0,.2,1);
    }

    .envelope::before{
        content:"";
        position:absolute;
        inset:0;
        clip-path:polygon(0 0,50% 55%,100% 0);
        background:#222;
    }

    .open-text{
        position:absolute;
        bottom:12px;
        width:100%;
        text-align:center;
        font-size:50px;
        letter-spacing:3px;
        color:#aaa;
        z-index: 1000;
    }

    .envelope.active{
        bottom: 4%;
        animation: envelopeMove 1.4s cubic-bezier(.42,0,1,1) forwards;
        
    }

    @keyframes envelopeMove {
    0% {
        transform: translate(90%, -10%) rotate(90deg) scale(1);
    }

    20% {
        transform: translateX(60%) rotate(20deg) scale(1);
    }

    100% {
        transform: translateX(50%) rotate(0deg) scale(2.5);
    }
}

    /* ================= PESAN ================= */
    .message{
        position:absolute;
        top:50%;
        left:175vw; /* START DI LUAR LAYAR KANAN */
        transform:translateY(250%);
        font-size:150px;
        font-weight:500;
        letter-spacing:3px;
        white-space:nowrap;
        word-spacing: 600px;
        opacity:1;

        color:#9ad0ff;
        text-shadow:
            0 0 12px rgba(154,208,255,.45),
            0 0 30px rgba(154,208,255,.3),
            0 0 60px rgba(154,208,255,.2);
    }

    /* ANIMASI SATU KALIMAT */
    .message.animate{
        animation:
            sentenceFly 7s linear forwards;
    }

    @keyframes sentenceFly{
        0%{
            transform:translate(0, 250%);
        }
        100%{
            transform:translate(-600vw, 250%);
        }
    }

    </style>
    </head>
    <body>

        <div class="envelope" id="envelope">
            <div class="open-text">BUKA</div>
        </div>

        <div class="message" id="message">
            I... Love...  You ❤️‍🔥❤️‍🔥❤️‍🔥
        </div>

        <script>
        const envelope = document.getElementById("envelope");
        const message = document.getElementById("message");
        let played = false;

        envelope.onclick = () => {
            if (played) return;
            played = true;

            envelope.classList.add("active");

            setTimeout(() => {
                message.classList.add("animate");
            }, 700);
        };
        </script>

    </body>
</html>
