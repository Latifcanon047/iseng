<!DOCTYPE html>
<html lang="id">
    <head>
    <meta charset="UTF-8">
    <title>Idiot</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

    <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Montserrat', sans-serif;
    }

    body{
        width:100vw;
        height:100dvh; /* FIX mobile viewport */
        background:#000;
        overflow:hidden;
    }

    .envelope{
        position: fixed;
        bottom: 50%;
        right: 50%;
        width: 300px;
        height: 200px;

        background: #111;
        border: 1px solid #666;
        cursor: pointer;
        z-index: 1000;

        transform: translate(50%, 50%) rotate(90deg);
        transition: bottom 0.9s cubic-bezier(.4,0,.2,1);
        perspective: 1000px; /* WAJIB */
    }

    /* SEGITIGA ATAS */
    .flap{
        position:absolute;
        top:0;
        left:0;
        width:100%;
        height:55%;
        background:#222;
        z-index: 100;

        /* segitiga mengarah ke BAWAH */
        clip-path: polygon(0 0, 50% 100%, 100% 0);

        transform-origin: 50% 0%; /* ENGSEL DI ATAS */
        transform: rotateX(0deg);
        transition: transform 0.8s ease-in-out;

        backface-visibility: visible;
    }

    /* DIBUKA KAYAK BUKU */
    .envelope.open .flap{
        transform: rotateX(265deg);
    }

    .open-text{
        position:absolute;
        bottom:12px;
        width:100%;
        text-align:center;
        font-size:50px;
        font-weight: 200;
        font-family: 'Dancing Script', cursive;
        letter-spacing:3px;
        color:#aaa;
        z-index: 1000;
    }

    .envelope.active{
        bottom: 4%;
        animation: envelopeMove 1.4s cubic-bezier(.42,0,1,1) forwards;
        
    }

    @keyframes envelopeMove {
    0% {
        transform: translate(50%, 50%) rotate(90deg) scale(1);
    }

    10% {
        transform: translate(90%, -30%) rotate(70deg) scale(1);
    }

    20% {
        transform: translateX(60%) rotate(10deg) scale(1);
    }

    100% {
        transform: translateX(50%) rotate(0deg) scale(2);
    }
}

    /* ================= PESAN ================= */
    .message{
        position:fixed;
        bottom: -100%;
        right: 50%;
        transform:translate(50%) rotate(90deg);
        font-size:300px;
        font-weight:500;
        letter-spacing:3px;
        white-space:nowrap;
        word-spacing: 150px;
        opacity:1;
        transition: bottom 6s linear;
        z-index: 200;

        color:#9ad0ff;
        text-shadow:
            0 0 12px rgba(154,208,255,.45),
            0 0 30px rgba(154,208,255,.3),
            0 0 60px rgba(154,208,255,.2);
    }

    /* ANIMASI SATU KALIMAT */
    .message.animate{
        bottom: 200%;
    }

    </style>
    </head>
    <body>

        <div class="envelope" id="envelope">
            <div class="flap"></div>
            <div class="open-text">BUKA</div>
        </div>

        <div class="message" id="message">
            HIDUP JOKOWI!!!
        </div>

        <script>
        const envelope = document.getElementById("envelope");
        const message = document.getElementById("message");
        let played = false;

        envelope.onclick = () => {
            if (played) return;
            played = true;

            envelope.classList.add("active");
            setTimeout(() => {
                envelope.classList.add("open");
            }, 800)

            setTimeout(() => {
                message.classList.add("animate");
            }, 900);
        };
        </script>

    </body>
</html>
